<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Tool Box</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // https://github.com/rafgraph/spa-github-pages
      // GitHub Pages has no server-side rewrite, so a direct link or refresh on
      // a client-side route (e.g. /expense-tracker) hits this 404 page. Redirect
      // to index.html with the real path encoded in the query string.
      var pathSegmentsToKeep = 1; // keep "/ToolBox-Frontend" (the repo name segment)

      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
  </body>
</html>
