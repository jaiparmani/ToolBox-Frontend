<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- Money OS mark: dark rounded-square ground carrying the constellation glyph -->
  <rect x="1" y="1" width="30" height="30" rx="8" fill="#0a0a0c"/>
  <rect x="1.5" y="1.5" width="29" height="29" rx="7.5" fill="none" stroke="#30d6a5" stroke-opacity="0.28" stroke-width="1"/>
  <!-- connecting spokes -->
  <path d="M16 16 L16 8 M16 16 L23 20 M16 16 L9 20" stroke="#30d6a5" stroke-width="1.8" stroke-linecap="round" stroke-opacity="0.85"/>
  <!-- centre node -->
  <circle cx="16" cy="16" r="4.2" fill="#30d6a5"/>
  <!-- satellite nodes -->
  <circle cx="16" cy="8" r="2.6" fill="#30d6a5"/>
  <circle cx="23" cy="20" r="2.6" fill="#30d6a5"/>
  <circle cx="9" cy="20" r="2.6" fill="#30d6a5"/>
</svg>
